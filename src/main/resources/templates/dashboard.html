<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ChoreForge Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="card shadow-sm">
    <div class="card-header bg-white">
        <h2 class="h5 mb-0">Current week tasks</h2>
    </div>

    <div class="card-body">
        <div th:each="entry : ${tasksByDate}" class="mb-4">

            <div class="d-flex align-items-center justify-content-between mb-2">
                <h3 class="h6 fw-bold mb-0"
                    th:text="${#temporals.format(entry.key, 'EEEE dd/MM/yyyy')}">
                    Monday 15/06/2026
                </h3>

                <span th:if="${entry.key.equals(today)}"
                      class="badge text-bg-primary">
                    Today
                </span>
            </div>

            <div class="list-group">
                <div th:each="task : ${entry.value}"
                     class="list-group-item">

                    <div class="d-flex justify-content-between align-items-start gap-3">

                        <div>
                            <div class="fw-semibold"
                                 th:text="${task.taskTemplate.name}">
                                Wash dishes
                            </div>

                            <div class="small text-muted">
                                Assigned to
                                <span th:text="${task.assignedTo.name}">Player1</span>

                                <span th:if="${task.groupName != null}">
                                    · Group:
                                    <span th:text="${task.groupName}">Bathroom</span>
                                </span>

                                <span th:if="${task.groupName == null}">
                                    · Single task
                                </span>
                            </div>

                            <div class="small text-muted">
                                Points:
                                <span th:text="${task.taskTemplate.points}">5</span>
                                · Penalty:
                                <span th:text="${task.taskTemplate.penalty}">2</span>
                            </div>
                        </div>

                        <div class="text-end">

                            <div class="mb-2">
                                <span th:if="${task.status.name() == 'PENDING'}"
                                      class="badge text-bg-warning">
                                    Pending
                                </span>

                                <span th:if="${task.status.name() == 'COMPLETED'}"
                                      class="badge text-bg-success">
                                    Completed
                                </span>

                                <span th:if="${task.status.name() == 'MISSED'}"
                                      class="badge text-bg-danger">
                                    Missed
                                </span>
                            </div>

                            <form th:if="${task.status.name() == 'PENDING'}"
                                  th:action="@{/web/tasks/{id}/complete(id=${task.id})}"
                                  method="post">
                                <button type="submit" class="btn btn-sm btn-primary">
                                    Complete
                                </button>
                            </form>

                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
